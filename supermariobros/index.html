<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Bros. - Mundo 1 Completo (1-1 a 1-4)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d12;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }
        .retro-shadow {
            text-shadow: 2px 2px 0px #000000;
        }
        .retro-btn {
            background: #D82800;
            border: 3px solid #FC9838;
            box-shadow: 0 4px 0 #781000, 0 6px 12px rgba(0,0,0,0.5);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }
        .retro-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #781000, 0 2px 4px rgba(0,0,0,0.5);
        }
        .touch-btn {
            background: rgba(255, 255, 255, 0.22);
            border: 3px solid rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.4);
        }
        .touch-btn:active, .touch-btn.active {
            background: rgba(252, 152, 56, 0.65);
            border-color: #FFF;
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
        }
        .level-btn {
            background: #27272a;
            border: 2px solid #52525b;
            color: #d4d4d8;
            transition: all 0.15s ease;
        }
        .level-btn:hover, .level-btn.active-lvl {
            background: #dc2626;
            border-color: #fca5a5;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.6);
        }

    <script>
        /* ============================================================================
         * 1. SINTETIZADOR DE AUDIO RETRO DE 8 BITS (Música y Efectos de Sonido)
         * ============================================================================ */
        class ChiptuneAudio {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.currentBgm = null;
                this.bgmTimer = null;
                this.bgmStep = 0;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleMute() {
                this.muted = !this.muted;
                if (this.muted) {
                    this.stopBGM();
                } else if (game.state === 'PLAYING') {
                    this.playLevelBGM(game.currentLevel);
                }
                return this.muted;
            }

            playTone(freq, type = 'square', duration = 0.1, startTime = 0, vol = 0.12, slideTo = null) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime + startTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                if (slideTo) {
                    osc.frequency.exponentialRampToValueAtTime(Math.max(10, slideTo), now + duration);
                }

                gain.gain.setValueAtTime(vol, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + duration);
            }

            // Efectos de sonido clásicos
            jump(isSuper = false) {
                this.playTone(isSuper ? 170 : 230, 'square', 0.2, 0, 0.12, isSuper ? 540 : 680);
            }

            coin() {
                this.playTone(987.77, 'square', 0.08, 0, 0.12);
                this.playTone(1318.51, 'square', 0.32, 0.08, 0.12);
            }

            bump() {
                this.playTone(140, 'triangle', 0.1, 0, 0.2, 60);
            }

            breakBlock() {
                this.playTone(190, 'sawtooth', 0.08, 0, 0.15, 60);
                this.playTone(110, 'square', 0.12, 0.04, 0.15, 40);
            }

            stomp() {
                this.playTone(330, 'square', 0.08, 0, 0.16, 110);
            }

            kickShell() {
                this.playTone(480, 'square', 0.1, 0, 0.16, 180);
            }

            powerUpAppear() {
                const notes = [330, 392, 659, 523, 587, 784];
                notes.forEach((n, i) => this.playTone(n, 'square', 0.06, i * 0.055, 0.1));
            }

            powerUpCollect() {
                const notes = [330, 392, 659, 523, 587, 784, 880, 1046.5];
                notes.forEach((n, i) => this.playTone(n, 'square', 0.07, i * 0.055, 0.12));
            }

            powerDown() {
                const notes = [659, 587, 523, 440, 349, 261];
                notes.forEach((n, i) => this.playTone(n, 'sawtooth', 0.07, i * 0.05, 0.14));
            }

            bowserFire() {
                this.playTone(120, 'sawtooth', 0.3, 0, 0.2, 40);
                this.playTone(90, 'triangle', 0.35, 0.05, 0.2, 30);
            }

            bridgeCollapse() {
                for (let i = 0; i < 7; i++) {
                    this.playTone(200 - i * 20, 'sawtooth', 0.12, i * 0.08, 0.18, 50);
                }
            }

            flagpole() {
                const notes = [261, 329, 392, 523, 659, 784, 1046];
                notes.forEach((n, i) => this.playTone(n, 'square', 0.1, i * 0.08, 0.14));
            }

            stageClear() {
                this.stopBGM();
                const notes = [
                    { f: 523.25, d: 0.14, t: 0.00 },
                    { f: 659.25, d: 0.14, t: 0.15 },
                    { f: 783.99, d: 0.14, t: 0.30 },
                    { f: 1046.50, d: 0.25, t: 0.45 },
                    { f: 783.99, d: 0.14, t: 0.72 },
                    { f: 1046.50, d: 0.45, t: 0.88 }
                ];
                notes.forEach(m => this.playTone(m.f, 'square', m.d, m.t, 0.15));
            }

            die() {
                this.stopBGM();
                const notes = [
                    { f: 500, d: 0.1, t: 0.0 },
                    { f: 700, d: 0.12, t: 0.14 },
                    { f: 700, d: 0.12, t: 0.3 },
                    { f: 660, d: 0.14, t: 0.46 },
                    { f: 587, d: 0.14, t: 0.62 },
                    { f: 523, d: 0.3, t: 0.78 }
                ];
                notes.forEach(m => this.playTone(m.f, 'square', m.d, m.t, 0.16));
            }

            // Reproductor Chiptune para los temas de cada nivel
            stopBGM() {
                if (this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                }
                this.currentBgm = null;
            }

            playLevelBGM(levelNum) {
                if (this.muted) return;
                this.init();
                this.stopBGM();
                this.currentBgm = levelNum;
                this.bgmStep = 0;

                // Definición de pistas sintetizadas
                let melody = [];
                let speed = 150;

                if (levelNum === '1-1' || levelNum === '1-3') {
                    // Tema Overworld
                    melody = [
                        659, 659, 0, 659, 0, 523, 659, 0, 784, 0, 0, 0, 392, 0, 0, 0,
                        523, 0, 0, 392, 0, 0, 330, 0, 0, 440, 0, 494, 0, 466, 440, 0,
                        392, 659, 784, 880, 0, 698, 784, 0, 659, 0, 523, 587, 494, 0
                    ];
                    speed = 135;
                } else if (levelNum === '1-2') {
                    // Tema Underground (Bajo clásico)
                    melody = [
                        220, 440, 196, 392, 185, 370, 175, 349,
                        0, 0, 220, 440, 196, 392, 185, 370, 175, 349,
                        0, 261, 247, 233, 220, 0, 293, 277, 261, 247, 0, 0
                    ];
                    speed = 145;
                } else if (levelNum === '1-4') {
                    // Tema Castillo Bowser (Eerie staccato)
                    melody = [
                        293, 0, 311, 0, 329, 0, 311, 0, 293, 0, 277, 0, 261, 0, 277, 0,
                        293, 293, 0, 311, 311, 0, 329, 329, 0, 311, 311, 0, 247, 0, 261, 0
                    ];
                    speed = 130;
                }

                this.bgmTimer = setInterval(() => {
                    if (this.muted || game.state !== 'PLAYING') return;
                    const freq = melody[this.bgmStep];
                    if (freq > 0) {
                        this.playTone(freq, levelNum === '1-2' ? 'triangle' : 'square', (speed / 1000) * 0.8, 0, levelNum === '1-2' ? 0.16 : 0.08);
                    }
                    this.bgmStep = (this.bgmStep + 1) % melody.length;
                }, speed);
            }
        }

        const sfx = new ChiptuneAudio();

        /* ============================================================================
         * 2. SISTEMA DE SPRITES PIXEL-ART (Estilo NES 8-bits)
         * ============================================================================ */
        const TILE = 32;
        const VIRTUAL_W = 800;
        const VIRTUAL_H = 480;
        const GROUND_ROW = 13;
        const GROUND_Y = GROUND_ROW * TILE;

        function drawPixelMatrix(ctx, matrix, palette, x, y, pixelSize = 2, flipX = false) {
            const rows = matrix.length;
            const cols = matrix[0].length;
            for (let r = 0; r < rows; r++) {
                const rowStr = matrix[r];
                for (let c = 0; c < cols; c++) {
                    const ch = rowStr[c];
                    if (ch !== '.' && palette[ch]) {
                        ctx.fillStyle = palette[ch];
                        const drawCol = flipX ? (cols - 1 - c) : c;
                        ctx.fillRect(x + drawCol * pixelSize, y + r * pixelSize, pixelSize, pixelSize);
                    }
                }
            }
        }

            },
            // Paleta Koopa Troopa fiel a la imagen (caparazón verde con rombos, cresta y vientre blanco, cuerpo y botas amarillas)
            koopa: {

                'Y': '#FCD818', // Amarillo cuerpo, pico y botas
                'W': '#FFFFFF', // Blanco cresta, franja ventral y suelas
                'K': '#000000', // Delineado negro y ojos
                'O': '#E48800'  // Sombreado de botas
            },
            mushroom: { 'R': '#D82800', 'O': '#FC9838', 'W': '#FFFFFF', 'K': '#000000' },

        function drawGroundTile(ctx, x, y, theme) {
            ctx.fillStyle = theme.brick;
            ctx.fillRect(x, y, TILE, TILE);
            ctx.fillStyle = theme.brickLight;
            ctx.fillRect(x, y, TILE - 2, 2);
            ctx.fillRect(x, y, 2, TILE - 2);
            ctx.fillRect(x + 20, y + 2, 2, 12);
            ctx.fillRect(x + 2, y + 16, 18, 2);
            ctx.fillStyle = '#000000';
            ctx.fillRect(x + TILE - 2, y, 2, TILE);
            ctx.fillRect(x, y + TILE - 2, TILE, 2);
            ctx.fillRect(x + 18, y, 2, 16);
            ctx.fillRect(x, y + 14, 18, 2);
            ctx.fillRect(x + 18, y + 16, 12, 2);
            ctx.fillRect(x + 10, y + 16, 2, 14);
            ctx.fillRect(x + 24, y + 18, 2, 12);
        }

        function drawBrickTile(ctx, x, y, theme) {
            ctx.fillStyle = theme.brick;
            ctx.fillRect(x, y, TILE, TILE);
            ctx.fillStyle = theme.brickLight;
            ctx.fillRect(x, y, TILE, 2);
            ctx.fillStyle = '#000000';
            for (let row = 0; row < 4; row++) {
                const ry = y + row * 8;
                ctx.fillRect(x, ry + 6, TILE, 2);
                const offset = (row % 2 === 0) ? 0 : 8;
                ctx.fillRect(x + offset + 6, ry, 2, 6);
                ctx.fillRect(x + offset + 22, ry, 2, 6);
            }
        }

        function drawQuestionTile(ctx, x, y, frame = 0, used = false, theme) {
            if (used) {
                ctx.fillStyle = theme.type === 'underground' ? '#004044' : (theme.type === 'castle' ? '#383838' : '#887000');
                ctx.fillRect(x, y, TILE, TILE);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + 4, y + 4, 2, 2);
                ctx.fillRect(x + TILE - 6, y + 4, 2, 2);
                ctx.fillRect(x + 4, y + TILE - 6, 2, 2);
                ctx.fillRect(x + TILE - 6, y + TILE - 6, 2, 2);
                return;
            }
            const colors = ['#FC9838', '#FCA044', '#C84C0C', '#FCA044'];
            const bg = colors[Math.floor(frame / 10) % colors.length];
            ctx.fillStyle = bg;
            ctx.fillRect(x, y, TILE, TILE);
            ctx.fillStyle = '#FCBCB0';
            ctx.fillRect(x + 2, y + 2, TILE - 4, 2);
            ctx.fillRect(x + 2, y + 2, 2, TILE - 4);
            ctx.fillStyle = '#000000';
            ctx.fillRect(x, y, TILE, 2);
            ctx.fillRect(x, y, 2, TILE);
            ctx.fillRect(x + TILE - 2, y, 2, TILE);
            ctx.fillRect(x, y + TILE - 2, TILE, 2);
            ctx.fillRect(x + 4, y + 4, 2, 2);
            ctx.fillRect(x + TILE - 6, y + 4, 2, 2);
            ctx.fillRect(x + 4, y + TILE - 6, 2, 2);
            ctx.fillRect(x + TILE - 6, y + TILE - 6, 2, 2);

            const drawQ = (ox, oy, color) => {
                ctx.fillStyle = color;
                ctx.fillRect(x + 10 + ox, y + 6 + oy, 10, 4);
                ctx.fillRect(x + 8 + ox, y + 8 + oy, 4, 4);
                ctx.fillRect(x + 18 + ox, y + 8 + oy, 4, 6);
                ctx.fillRect(x + 14 + ox, y + 14 + oy, 6, 4);
                ctx.fillRect(x + 14 + ox, y + 16 + oy, 4, 4);
                ctx.fillRect(x + 14 + ox, y + 22 + oy, 4, 4);
            };
            drawQ(2, 2, '#000000');
            drawQ(0, 0, '#C84C0C');
        }

        function drawHardBlockTile(ctx, x, y, theme) {
            ctx.fillStyle = theme.brick;
            ctx.fillRect(x, y, TILE, TILE);
            ctx.fillStyle = theme.brickLight;
            ctx.fillRect(x, y, TILE - 2, 4);
            ctx.fillRect(x, y, 4, TILE - 2);
            ctx.fillStyle = '#000000';
            ctx.fillRect(x + TILE - 4, y + 2, 4, TILE - 2);
            ctx.fillRect(x + 2, y + TILE - 4, TILE - 2, 4);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
        }

        function drawPipe(ctx, x, y, widthTiles, heightTiles, theme) {
            const w = widthTiles * TILE;
            const h = heightTiles * TILE;
            const lipH = TILE;
            const bodyX = x + 4;
            const bodyW = w - 8;

            ctx.fillStyle = theme.pipe;
            ctx.fillRect(bodyX, y + lipH, bodyW, h - lipH);
            ctx.fillStyle = theme.pipeLight;
            ctx.fillRect(bodyX + 6, y + lipH, 10, h - lipH);
            ctx.fillRect(bodyX + 20, y + lipH, 4, h - lipH);
            ctx.fillStyle = theme.pipeDark;
            ctx.fillRect(bodyX + bodyW - 12, y + lipH, 8, h - lipH);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.strokeRect(bodyX, y + lipH, bodyW, h - lipH);

            ctx.fillStyle = theme.pipe;
            ctx.fillRect(x, y, w, lipH);
            ctx.fillStyle = theme.pipeLight;
            ctx.fillRect(x + 8, y + 2, 12, lipH - 4);
            ctx.fillRect(x + 24, y + 2, 4, lipH - 4);
            ctx.fillStyle = theme.pipeDark;
            ctx.fillRect(x + w - 14, y + 2, 10, lipH - 4);
            ctx.strokeRect(x, y, w, lipH);
        }

        // Decoraciones especiales (Champiñón gigante para 1-3, Lava para 1-4)
        function drawGiantMushroom(ctx, x, topY, heightTiles, color = '#FC9838') {
            const h = heightTiles * TILE;
            // Tallo beige/marrón
            ctx.fillStyle = '#FCBCB0';
            ctx.fillRect(x + 16, topY + 24, 32, h - 24);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + 16, topY + 24, 32, h - 24);

            // Copa del hongo (plataforma superior)
            const capW = 128;
            const capX = x - 32;
            ctx.fillStyle = color;
            ctx.fillRect(capX, topY, capW, 24);
            ctx.fillStyle = '#FFFFFF';
            // Lunares blancos clásicos
            ctx.fillRect(capX + 16, topY + 6, 16, 12);
            ctx.fillRect(capX + 56, topY + 6, 16, 12);
            ctx.fillRect(capX + 96, topY + 6, 16, 12);
            ctx.strokeStyle = '#000000';
            ctx.strokeRect(capX, topY, capW, 24);
        }

        function drawLava(ctx, x, y, widthTiles, frame) {
            const w = widthTiles * TILE;
            const h = TILE * 2;
            // Capa base de lava incandescente
            ctx.fillStyle = '#D82800';
            ctx.fillRect(x, y, w, h);

            // Olas superiores de fuego
            ctx.fillStyle = '#FC9838';
            for (let i = 0; i < w; i += 16) {
                const wave = Math.sin((i + frame * 4) * 0.1) * 3;
                ctx.fillRect(x + i, y + wave, 16, 6);
            }
            // Núcleo amarillo brillante
            ctx.fillStyle = '#FCF898';
            for (let i = 8; i < w; i += 32) {
                ctx.fillRect(x + i, y + 6, 12, 4);
            }
        }

                game.castleX = 158 * TILE;
                game.flagpole = { x: 152 * TILE + 12, y: 3 * TILE, height: 9 * TILE, flagY: 3.2 * TILE, reached: false };

                // Escalones de acceso seguro desde la plataforma inicial
                addBlock(11, 12, 'hard');
                addBlock(12, 11, 'hard');

                // Champiñones gigantes con plataformas (calibrados con saltos de 1 a 2 tiles)
                game.giantMushrooms.push(
                    { x: 16 * TILE, topY: 10 * TILE, hTiles: 3, color: '#FC9838' },
                    { x: 27 * TILE, topY: 8 * TILE, hTiles: 5, color: '#00A800' },
                    { x: 38 * TILE, topY: 7 * TILE, hTiles: 6, color: '#FC9838' },
                    { x: 49 * TILE, topY: 6 * TILE, hTiles: 7, color: '#00A800' },
                    { x: 61 * TILE, topY: 7 * TILE, hTiles: 6, color: '#FC9838' },
                    { x: 73 * TILE, topY: 6 * TILE, hTiles: 7, color: '#00A800' },
                    { x: 85 * TILE, topY: 7 * TILE, hTiles: 6, color: '#FC9838' },
                    { x: 98 * TILE, topY: 8 * TILE, hTiles: 5, color: '#00A800' },
                    { x: 111 * TILE, topY: 10 * TILE, hTiles: 3, color: '#FC9838' }
                );

                // Pasarelas y puentes suspendidos de madera
                for (let c = 20; c <= 24; c++) addBlock(c, 9, 'brick', null);
                addBlock(22, 5, 'question', 'mushroom');

                for (let c = 31; c <= 35; c++) addBlock(c, 7, 'brick', null);
                addBlock(33, 4, 'question', 'coin');

                for (let c = 42; c <= 46; c++) addBlock(c, 8, 'brick', null);

                for (let c = 53; c <= 58; c++) addBlock(c, 6, 'brick', null);
                addBlock(55, 3, 'question', 'coin');

                for (let c = 65; c <= 70; c++) addBlock(c, 7, 'brick', null);

                for (let c = 77; c <= 82; c++) addBlock(c, 6, 'brick', null);
                addBlock(79, 3, 'question', 'coin');

                for (let c = 89; c <= 95; c++) addBlock(c, 8, 'brick', null);
                addBlock(92, 5, 'question', 'mushroom');

                for (let c = 102; c <= 108; c++) addBlock(c, 9, 'brick', null);

                // Escalones de descenso hacia la plataforma de meta
                addBlock(115, 11, 'hard');
                addBlock(116, 12, 'hard');

                // Escalera final hacia el mástil
                for (let i = 0; i < 7; i++) {
                    for (let h = 0; h <= i; h++) addBlock(138 + i, GROUND_ROW - 1 - h, 'hard');
                }
                for (let h = 0; h < 7; h++) addBlock(145, GROUND_ROW - 1 - h, 'hard');
                addBlock(152, GROUND_ROW - 1, 'hard');

                // Enemigos calibrados sobre plataformas seguras
                addKoopa(22, 7.8);
                addKoopa(33, 5.8);
                addKoopa(55, 4.8);
                addKoopa(67, 5.8);
                addKoopa(79, 4.8);
                addKoopa(104, 7.8);
                addGoomba(126);
            }

            /* ----------------------------------------------------
             * NIVEL 1-4: El Castillo de Bowser (Lava, Barras de Fuego y Hacha)
             * ---------------------------------------------------- */
            else if (levelId === '1-4') {
                game.levelWidthTiles = 140;
                game.pits = []; // En castillo los abismos son fosas de lava
                game.castleX = 132 * TILE;

                // Techo de piedra del castillo
                for (let c = 0; c < 130; c++) {
                    addBlock(c, 1, 'brick', null);
                }

                // Fosas de lava incandescente
                game.lavaPits.push(
                    { startCol: 22, endCol: 27 },
                    { startCol: 44, endCol: 50 },
                    { startCol: 72, endCol: 78 },
                    { startCol: 96, endCol: 114 } // Gran foso de lava bajo el puente de Bowser
                );

                // Barras de Fuego giratorias (Fire Bars)
                game.fireBars.push(
                    { x: 16 * TILE + 16, y: 8 * TILE + 16, length: 5, angle: 0, speed: 0.045 },
                    { x: 38 * TILE + 16, y: 7 * TILE + 16, length: 5, angle: Math.PI / 2, speed: -0.045 },
                    { x: 62 * TILE + 16, y: 8 * TILE + 16, length: 5, angle: Math.PI, speed: 0.05 },
                    { x: 86 * TILE + 16, y: 7 * TILE + 16, length: 5, angle: 0, speed: -0.05 }
                );

                // Bloques centrales de las barras de fuego
                addBlock(16, 8, 'hard', null);
                addBlock(38, 7, 'hard', null);
                addBlock(62, 8, 'hard', null);
                addBlock(86, 7, 'hard', null);

                // Plataformas sobre la lava
                for (let c = 24; c <= 25; c++) addBlock(c, 8, 'hard', null);
                for (let c = 46; c <= 48; c++) addBlock(c, 7, 'hard', null);
                for (let c = 74; c <= 76; c++) addBlock(c, 8, 'hard', null);

                // Bloques de soporte
                addBlock(32, 9, 'question', 'mushroom');
                addBlock(56, 8, 'brick', null);
                addBlock(57, 8, 'question', 'coin');
                addBlock(58, 8, 'brick', null);

                // PUENTE DE MADERA SOBRE LA LAVA (Cols 98 a 112)
                for (let c = 98; c <= 112; c++) {
                    const b = {
                        col: c, row: GROUND_ROW - 2,
                        x: c * TILE, y: (GROUND_ROW - 2) * TILE, baseY: (GROUND_ROW - 2) * TILE,
                        type: 'hard', content: null, used: false, bumpOffset: 0, bumpVel: 0, isBridge: true
                    };
                    game.blocks.push(b);
                    game.bridgeTiles.push(b);
                }

                // BOWSER sobre el puente
                game.bowser = {
                    x: 105 * TILE,
                    y: (GROUND_ROW - 4) * TILE,
                    vx: -0.5, vy: 0,
                    w: 48, h: 46,
                    minX: 101 * TILE,
                    maxX: 109 * TILE,
                    fireTimer: 0,
                    jumpTimer: 0,
                    hp: 5,
                    defeated: false,
                    falling: false
                };

                // EL HACHA (Axe) al final de la cadena del puente
                game.axe = {
                    x: 114 * TILE + 4,
                    y: (GROUND_ROW - 3) * TILE + 4,
                    w: 24,
                    h: 24,
                    triggered: false
                };

                // Recámara tras el puente con TOAD
                game.toad = {
                    x: 122 * TILE,
                    y: GROUND_Y - TILE,
                    w: 24,
                    h: 30,
                    rescued: false
                };
            }

            // Reposicionar a Mario al inicio del nivel
            mario.x = 48;
            mario.y = GROUND_Y - (mario.isSuper ? TILE * 2 : TILE);
            mario.vx = 0;
            mario.vy = 0;
            mario.facing = 1;
            mario.onGround = true;
            mario.isDucking = false;
            mario.invulnerable = 0;
            mario.enteringCastle = false;
            mario.hiddenInCastle = false;
            mario.h = mario.isSuper ? TILE * 2 - 4 : TILE - 2;

            updateHUD();
        }

        function isPit(col) {
            for (const [s, e] of game.pits) {
                if (col >= s && col <= e) return true;
            }
            for (const pit of game.lavaPits) {
                if (col >= pit.startCol && col <= pit.endCol) return true;
            }
            return false;
        }

        function aabb(a, b) {
            return (
                a.x < b.x + b.w &&
                a.x + a.w > b.x &&
                a.y < b.y + b.h &&
                a.y + a.h > b.y
            );
        }

        function addFloatingText(text, x, y, color = '#FFFFFF') {
            game.floatingTexts.push({ text, x, y, vy: -1.4, life: 45, color });
        }

        function spawnBrickParticles(x, y, theme) {
            const speeds = [
                { vx: -3.2, vy: -7.5 }, { vx: 3.2, vy: -7.5 },
                { vx: -2.5, vy: -4.5 }, { vx: 2.5, vy: -4.5 }
            ];
            speeds.forEach(s => {
                game.particles.push({
                    x: x + 8, y: y + 8,
                    vx: s.vx, vy: s.vy, rot: 0, life: 55, color: theme.brick
                });
            });
        }

        /* ============================================================================
         * 5. MECÁNICAS DE JUEGO, FÍSICA Y COLISIONES
         * ============================================================================ */
        function getSolidObstacles() {
            const solids = [];
            const theme = LEVEL_THEMES[game.currentLevel];
            const startCol = Math.max(0, Math.floor(game.cameraX / TILE) - 2);
            const endCol = Math.min(game.levelWidthTiles, startCol + 32);

            // Suelo (excepto en abismos y lava)
            for (let c = startCol; c <= endCol; c++) {
                if (!isPit(c)) {
                    solids.push({ x: c * TILE, y: GROUND_Y, w: TILE, h: TILE * 2, isGround: true });
                }
            }

            // Tuberías
            game.pipes.forEach(p => solids.push({ x: p.x, y: p.y, w: p.w, h: p.h, isPipe: true }));

            // Plataformas de champiñones gigantes (1-3)
            game.giantMushrooms.forEach(m => {
                const capW = 128;
                const capX = m.x - 32;
                solids.push({ x: capX, y: m.topY, w: capW, h: 24, isMushroom: true });
            });

            // Bloques aéreos
            game.blocks.forEach(b => {
                if (b.x > game.cameraX - TILE * 2 && b.x < game.cameraX + VIRTUAL_W + TILE * 2) {
                    solids.push({ x: b.x, y: b.baseY, w: TILE, h: TILE, blockRef: b });
                }
            });

            return solids;
        }

        function triggerBlockHit(block) {
            if (block.used) {
                sfx.bump();
                return;
            }

            const theme = LEVEL_THEMES[game.currentLevel];

            // Golpear enemigos sobre el bloque
            game.enemies.forEach(e => {
                if (e.x + e.w > block.x && e.x < block.x + TILE && Math.abs((e.y + e.h) - block.y) <= 6) {
                    e.state = 'flipped';
                    e.vy = -6;
                    e.vx = 2;
                    game.score += 100;
                    sfx.stomp();
                    addFloatingText('100', e.x, e.y);
                }
            });

            if (block.type === 'question' || block.content) {
                block.used = true;
                block.bumpVel = -4.2;

                if (block.content === 'coin') {
                    sfx.coin();
                    game.coins++;
                    game.score += 200;
                    if (game.coins >= 100) {
                        game.coins -= 100;
                        game.lives++;
                        sfx.powerUpCollect();
                    }
                    game.items.push({
                        type: 'coinJump',
                        x: block.x + 6, y: block.y - 20, vy: -7, startY: block.y - 10
                    });
                    addFloatingText('200', block.x + 4, block.y - 20, '#FCD34D');
                } else if (block.content === 'mushroom') {
                    sfx.powerUpAppear();
                    game.items.push({
                        type: 'mushroom',
                        x: block.x + 2, y: block.y, targetY: block.y - TILE,
                        w: 28, h: 30, vx: 1.5, vy: 0, emerging: true
                    });
                }
                updateHUD();
            } else if (block.type === 'brick') {
                if (mario.isSuper) {
                    sfx.breakBlock();
                    game.score += 50;
                    spawnBrickParticles(block.x, block.y, theme);
                    const idx = game.blocks.indexOf(block);
                    if (idx !== -1) game.blocks.splice(idx, 1);
                    updateHUD();
                } else {
                    sfx.bump();
                    block.bumpVel = -4.0;
                }
            } else {
                sfx.bump();
            }
        }

        function hurtMario() {
            if (mario.invulnerable > 0 || game.state !== 'PLAYING') return;

            if (mario.isSuper) {
                mario.isSuper = false;
                mario.isDucking = false;
                mario.h = TILE - 2;
                mario.y += TILE;
                mario.invulnerable = 95;
                sfx.powerDown();
            } else {
                killMario();
            }
        }

        function killMario() {
            if (game.state === 'DYING') return;
            game.state = 'DYING';
            mario.vy = -9.2;
            mario.vx = 0;
            game.lives--;
            sfx.die();
            updateHUD();

            setTimeout(() => {
                if (game.lives > 0) {
                    showTransitionScreen(game.currentLevel);
                } else {
                    game.state = 'GAMEOVER';
                    showModal('FIN DEL JUEGO', 'Te has quedado sin vidas. ¡El Reino Champiñón necesita otro héroe!', false);
                }
            }, 2100);
        }

        // Pantalla clásica de transición negra "WORLD 1-X"
        function showTransitionScreen(levelId, onFinish) {
            game.state = 'TRANSITION';
            sfx.stopBGM();
            let timer = 0;

            const transitionLoop = () => {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, VIRTUAL_W, VIRTUAL_H);

                ctx.font = '16px "Press Start 2P", monospace';
                ctx.fillStyle = '#FFFFFF';
                ctx.textAlign = 'center';
                ctx.fillText(`WORLD ${levelId}`, VIRTUAL_W / 2, VIRTUAL_H / 2 - 24);

                // Icono de Mario x Vidas
                drawPixelMatrix(ctx, SPRITES.marioIdle, PALETTES.mario, VIRTUAL_W / 2 - 40, VIRTUAL_H / 2 + 10, 2);
                ctx.fillText(`×  ${game.lives}`, VIRTUAL_W / 2 + 20, VIRTUAL_H / 2 + 26);
                ctx.textAlign = 'left';

                timer++;
                if (timer < 70) {
                    requestAnimationFrame(transitionLoop);
                } else {
                    loadLevel(levelId);
                    game.state = 'PLAYING';
                    sfx.playLevelBGM(levelId);
                    if (onFinish) onFinish();
                }
            };
            requestAnimationFrame(transitionLoop);
        }

        // Derrota de Bowser al tocar el hacha en 1-4
        function triggerBowserBridgeCollapse() {
            if (game.axe.triggered) return;
            game.axe.triggered = true;
            sfx.bridgeCollapse();

            // Desintegrar bloques del puente de derecha a izquierda
            let bridgeIndex = game.bridgeTiles.length - 1;
            const collapseInterval = setInterval(() => {
                if (bridgeIndex >= 0) {
                    const tile = game.bridgeTiles[bridgeIndex];
                    const idx = game.blocks.indexOf(tile);
                    if (idx !== -1) {
                        spawnBrickParticles(tile.x, tile.y, LEVEL_THEMES['1-4']);
                        game.blocks.splice(idx, 1);
                    }
                    bridgeIndex--;
                } else {
                    clearInterval(collapseInterval);
                    // Bowser cae a la lava
                    if (game.bowser) {
                        game.bowser.falling = true;
                        game.bowser.vy = 4;
                    }
                }
            }, 60);

            // Tras caer Bowser, Mario camina hacia Toad
            setTimeout(() => {
                mario.enteringCastle = true;
            }, 1800);
        }

        function advanceToNextLevel() {
            const sequence = ['1-1', '1-2', '1-3', '1-4'];
            const nextIdx = sequence.indexOf(game.currentLevel) + 1;
            if (nextIdx < sequence.length) {
                const nextLevel = sequence[nextIdx];
                showTransitionScreen(nextLevel);
            } else {
                game.state = 'VICTORY';
                showModal(
                    '¡ENHORABUENA! ¡JUEGO COMPLETADO!',
                    'Has superado los 4 niveles del Mundo 1 y derrotado a Bowser en su castillo.',
                    false
                );
            }
        }

        /* ============================================================================
         * 6. ACTUALIZACIÓN DEL JUEGO (Mario, Enemigos, Barras de Fuego, Bowser)
         * ============================================================================ */
        function updateMario() {
            if (game.state === 'DYING') {
                mario.vy += 0.42;
                mario.y += mario.vy;
                return;
            }

            // Secuencia del banderín final (1-1, 1-2, 1-3)
            if (game.state === 'FLAGPOLE') {
                if (mario.y + mario.h < GROUND_Y - TILE) {
                    mario.y += 4;
                    game.flagpole.flagY = Math.min(GROUND_Y - TILE * 2, game.flagpole.flagY + 4);
                } else if (!mario.enteringCastle) {
                    mario.enteringCastle = true;
                    sfx.stageClear();
                } else {
                    mario.facing = 1;
                    mario.vx = 2.2;
                    mario.x += mario.vx;
                    mario.y = GROUND_Y - mario.h;
                    mario.animTimer++;
                    if (mario.animTimer % 5 === 0) mario.animFrame = (mario.animFrame + 1) % 3;

                    if (mario.x >= game.castleX + TILE * 2.2) {
                        mario.hiddenInCastle = true;
                        const timeBonus = game.time * 50;
                        game.score += timeBonus;
                        updateHUD();
                        setTimeout(() => advanceToNextLevel(), 1200);
                    }
                }
                return;
            }

            // Secuencia final con Toad en el Castillo (1-4)
            if (mario.enteringCastle && game.currentLevel === '1-4') {
                mario.facing = 1;
                mario.vx = 2.0;
                mario.x += mario.vx;
                mario.animTimer++;
                if (mario.animTimer % 5 === 0) mario.animFrame = (mario.animFrame + 1) % 3;

                if (mario.x >= game.toad.x - 40) {
                    mario.vx = 0;
                    mario.enteringCastle = false;
                    game.state = 'VICTORY';
                    sfx.stageClear();
                    setTimeout(() => {
                        showModal(
                            '¡REINO SALVADO!',
                            'TOAD DICE:\n"THANK YOU MARIO!\nBUT OUR PRINCESS IS IN ANOTHER CASTLE!"',
                            false
                        );
                    }, 1000);
                }
                return;
            }

            if (mario.invulnerable > 0) mario.invulnerable--;

            // Agacharse (Super Mario)
            mario.isDucking = keys.down && mario.isSuper && mario.onGround;
            if (mario.isDucking) {
                mario.h = TILE;
                mario.vx *= 0.85;
            } else {
                mario.h = mario.isSuper ? TILE * 2 - 4 : TILE - 2;
            }

            // Movimiento horizontal con inercia
            const maxSpeed = keys.run ? 5.2 : 3.6;
            const accel = mario.onGround ? 0.28 : 0.18;
            const friction = mario.onGround ? 0.84 : 0.94;

            if (!mario.isDucking) {
                if (keys.left) {
                    mario.vx = Math.max(mario.vx - accel, -maxSpeed);
                    mario.facing = -1;
                } else if (keys.right) {
                    mario.vx = Math.min(mario.vx + accel, maxSpeed);
                    mario.facing = 1;
                } else {
                    mario.vx *= friction;
                    if (Math.abs(mario.vx) < 0.08) mario.vx = 0;
                }
            }

            // Salto con control de altura variable
            if (keys.jumpPressed && mario.onGround && !mario.isDucking) {
                mario.vy = -8.6 - Math.abs(mario.vx) * 0.22;
                mario.onGround = false;
                mario.jumpHoldTimer = 14;
                keys.jumpPressed = false;
                sfx.jump(mario.isSuper);
            }

            if (keys.jump && mario.jumpHoldTimer > 0 && mario.vy < 0) {
                mario.vy -= 0.36;
                mario.jumpHoldTimer--;
            } else {
                mario.jumpHoldTimer = 0;
            }

            mario.vy = Math.min(mario.vy + 0.52, 11);

            const solids = getSolidObstacles();

            // Colisión Horizontal y límites bidireccionales
            mario.x += mario.vx;
            if (mario.x < 0) {
                mario.x = 0;
                mario.vx = 0;
            }

            for (const s of solids) {
                if (aabb(mario, s)) {
                    if (mario.vx > 0) {
                        mario.x = s.x - mario.w;
                        mario.vx = 0;
                    } else if (mario.vx < 0) {
                        mario.x = s.x + s.w;
                        mario.vx = 0;
                    }
                }
            }

            // Colisión Vertical
            mario.y += mario.vy;
            mario.onGround = false;

            for (const s of solids) {
                if (aabb(mario, s)) {
                    if (mario.vy > 0) {
                        mario.y = s.y - mario.h;
                        mario.vy = 0;
                        mario.onGround = true;
                    } else if (mario.vy < 0) {
                        mario.y = s.y + s.h;
                        mario.vy = 1.2;
                        if (s.blockRef) triggerBlockHit(s.blockRef);
                        else sfx.bump();
                    }
                }
            }

            // Caída en fosa o lava
            if (mario.y > VIRTUAL_H + 20) {
                killMario();
                return;
            }

            // Interacción con el Hacha en 1-4
            if (game.axe && !game.axe.triggered && aabb(mario, game.axe)) {
                triggerBowserBridgeCollapse();
            }

            // Comprobación de Banderín
            if (game.flagpole.x > 0 && !game.flagpole.reached &&
                mario.x + mario.w >= game.flagpole.x && mario.x <= game.flagpole.x + 16) {
                game.flagpole.reached = true;
                game.state = 'FLAGPOLE';
                mario.x = game.flagpole.x - 14;
                mario.vx = 0;
                mario.vy = 0;
                sfx.flagpole();
                game.score += 2000;
                addFloatingText('2000', mario.x + 16, mario.y, '#4ADE80');
                updateHUD();
            }

            // Animaciones
            if (!mario.onGround) {
                mario.animFrame = 3;
            } else if (mario.isDucking) {
                mario.animFrame = 4;
            } else if (Math.abs(mario.vx) > 0.2) {
                mario.animTimer += Math.abs(mario.vx) * 0.12;
                mario.animFrame = (Math.floor(mario.animTimer) % 2) + 1;
            } else {
                mario.animFrame = 0;
            }

            // Cámara bidireccional suave: sigue a Mario hacia adelante y hacia atrás
            const targetCam = mario.x - VIRTUAL_W * 0.38;
            const maxCam = Math.max(0, (game.levelWidthTiles * TILE) - VIRTUAL_W);
            const clampedTarget = Math.max(0, Math.min(targetCam, maxCam));
            game.cameraX += (clampedTarget - game.cameraX) * 0.14;
            if (mario.x < game.cameraX) game.cameraX = Math.max(0, mario.x);
        }

        function updateEntities() {
            const solids = getSolidObstacles();

            // Rebote de bloques
            game.blocks.forEach(b => {
                if (b.bumpVel !== 0 || b.bumpOffset !== 0) {
                    b.bumpOffset += b.bumpVel;
                    b.bumpVel += 0.85;
                    if (b.bumpOffset >= 0) {
                        b.bumpOffset = 0;
                        b.bumpVel = 0;
                    }
                    b.y = b.baseY + b.bumpOffset;
                }
            });

            // Rotación de Barras de Fuego (Fire Bars en 1-4)
            game.fireBars.forEach(fb => {
                fb.angle += fb.speed;
                // Comprobar colisión con cada bola de fuego
                for (let i = 1; i <= fb.length; i++) {
                    const dist = i * 16;
                    const fx = fb.x + Math.cos(fb.angle) * dist;
                    const fy = fb.y + Math.sin(fb.angle) * dist;
                    if (mario.x < fx + 8 && mario.x + mario.w > fx - 8 &&
                        mario.y < fy + 8 && mario.y + mario.h > fy - 8) {
                        hurtMario();
                    }
                }
            });

            // Lógica de Bowser (1-4)
            if (game.bowser) {
                const b = game.bowser;
                if (b.falling) {
                    b.y += b.vy;
                    b.vy += 0.5;
                } else if (!b.defeated) {
                    b.x += b.vx;
                    if (b.x < b.minX) { b.x = b.minX; b.vx = 0.5; }
                    if (b.x > b.maxX) { b.x = b.maxX; b.vx = -0.5; }

                    // Saltos periódicos
                    b.jumpTimer++;
                    if (b.jumpTimer > 130) {
                        b.jumpTimer = 0;
                        b.vy = -6;
                    }
                    b.vy = Math.min(b.vy + 0.4, 8);
                    b.y += b.vy;
                    if (b.y > (GROUND_ROW - 4) * TILE) {
                        b.y = (GROUND_ROW - 4) * TILE;
                        b.vy = 0;
                    }

                    // Escupir llamas hacia Mario
                    b.fireTimer++;
                    if (b.fireTimer > 160 && b.x - mario.x < 360) {
                        b.fireTimer = 0;
                        sfx.bowserFire();
                        game.items.push({
                            type: 'bowserFlame',
                            x: b.x - 8,
                            y: b.y + 12,
                            vx: -3.8,
                            w: 24, h: 12
                        });
                    }

                    // Colisión directa con Mario
                    if (aabb(mario, b)) {
                        hurtMario();
                    }
                }
            }

            // Objetos (Champiñones, Monedas, Llamas de Bowser)
            for (let i = game.items.length - 1; i >= 0; i--) {
                const it = game.items[i];
                if (it.type === 'coinJump') {
                    it.y += it.vy;
                    it.vy += 0.55;
                    if (it.y > it.startY) game.items.splice(i, 1);
                } else if (it.type === 'bowserFlame') {
                    it.x += it.vx;
                    if (aabb(mario, it)) hurtMario();
                    if (it.x < game.cameraX - 50) game.items.splice(i, 1);
                } else if (it.type === 'mushroom') {
                    if (it.emerging) {
                        it.y -= 1.2;
                        if (it.y <= it.targetY) {
                            it.y = it.targetY;
                            it.emerging = false;
                        }
                    } else {
                        it.vy = Math.min(it.vy + 0.45, 9);
                        it.x += it.vx;
                        for (const s of solids) {
                            if (aabb(it, s)) {
                                if (it.vx > 0) { it.x = s.x - it.w; it.vx = -it.vx; }
                                else { it.x = s.x + s.w; it.vx = -it.vx; }
                            }
                        }
                        it.y += it.vy;
                        for (const s of solids) {
                            if (aabb(it, s) && it.vy > 0) { it.y = s.y - it.h; it.vy = 0; }
                        }
                    }

                    if (aabb(mario, it)) {
                        sfx.powerUpCollect();
                        game.score += 1000;
                        addFloatingText('1000', it.x, it.y, '#4ADE80');
                        if (!mario.isSuper) {
                            mario.isSuper = true;
                            mario.y -= TILE;
                            mario.h = TILE * 2 - 4;
                        }
                        game.items.splice(i, 1);
                        updateHUD();
                    } else if (it.y > VIRTUAL_H + 50) {
                        game.items.splice(i, 1);
                    }
                }
            }

            // Enemigos (Goombas y Koopas)
            for (let i = game.enemies.length - 1; i >= 0; i--) {
                const e = game.enemies[i];
                if (!e.active && e.x < game.cameraX + VIRTUAL_W + 96) e.active = true;
                if (!e.active) continue;

                if (e.state === 'squished') {
                    e.timer++;
                    if (e.timer > 30) game.enemies.splice(i, 1);
                    continue;
                }

                if (e.state === 'flipped') {
                    e.x += e.vx; e.y += e.vy; e.vy += 0.45;
                    if (e.y > VIRTUAL_H + 60) game.enemies.splice(i, 1);
                    continue;
                }

                // Física del enemigo
                e.vy = Math.min(e.vy + 0.48, 9);
                e.x += e.vx;

                for (const s of solids) {
                    if (aabb(e, s)) {
                        if (e.vx > 0) { e.x = s.x - e.w; e.vx = -e.vx; }
                        else { e.x = s.x + s.w; e.vx = -e.vx; }
                    }
                }

                e.y += e.vy;
                for (const s of solids) {
                    if (aabb(e, s) && e.vy > 0) { e.y = s.y - e.h; e.vy = 0; }
                }

                if (e.y > VIRTUAL_H + 60) {
                    game.enemies.splice(i, 1);
                    continue;
                }

                // Colisión del caparazón rodante con otros enemigos
                if (e.type === 'koopa' && e.state === 'shell' && Math.abs(e.vx) > 1) {
                    game.enemies.forEach(other => {
                        if (other !== e && other.state !== 'flipped' && other.state !== 'squished' && aabb(e, other)) {
                            other.state = 'flipped';
                            other.vy = -6;
                            other.vx = e.vx > 0 ? 3 : -3;
                            sfx.kickShell();
                            game.score += 200;
                            addFloatingText('200', other.x, other.y);
                        }
                    });
                }

                // Interacción con Mario
                if (game.state === 'PLAYING' && aabb(mario, e)) {
                    const stompY = e.y + e.h * 0.55;
                    if (mario.vy > 0 && (mario.y + mario.h - mario.vy) <= stompY) {
                        mario.vy = -7.4;
                        if (e.type === 'goomba') {
                            e.state = 'squished';
                            e.timer = 0;
                            sfx.stomp();
                            game.score += 100;
                            addFloatingText('100', e.x, e.y);
                        } else if (e.type === 'koopa') {
                            if (e.state === 'walk') {
                                e.state = 'shell';
                                e.vx = 0;
                                e.h = 28;
                                e.y += 16;
                                sfx.stomp();
                            } else if (e.state === 'shell') {
                                e.vx = (mario.x + mario.w / 2 < e.x + e.w / 2) ? 7.2 : -7.2;
                                sfx.kickShell();
                            }
                        }
                        updateHUD();
                    } else if (e.type === 'koopa' && e.state === 'shell' && e.vx === 0) {
                        // Patear caparazón estático
                        e.vx = (mario.x + mario.w / 2 < e.x + e.w / 2) ? 7.2 : -7.2;
                        sfx.kickShell();
                    } else {
                        hurtMario();
                    }
                }
            }

            // Partículas
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.45; p.life--;
                if (p.life <= 0) game.particles.splice(i, 1);
            }

            // Textos flotantes
            for (let i = game.floatingTexts.length - 1; i >= 0; i--) {
                const ft = game.floatingTexts[i];
                ft.y += ft.vy; ft.life--;
                if (ft.life <= 0) game.floatingTexts.splice(i, 1);
            }
        }

        /* ============================================================================
         * 7. RENDERIZADO VISUAL DEL JUEGO
         * ============================================================================ */
        function renderGame() {
            const theme = LEVEL_THEMES[game.currentLevel];
            ctx.fillStyle = theme.bg;
            ctx.fillRect(0, 0, VIRTUAL_W, VIRTUAL_H);

            ctx.save();
            ctx.translate(-Math.floor(game.cameraX), 0);

            // Champiñones Gigantes (1-3)
            game.giantMushrooms.forEach(m => {
                if (m.x + 160 > game.cameraX && m.x - 60 < game.cameraX + VIRTUAL_W) {
                    drawGiantMushroom(ctx, m.x, m.topY, m.hTiles, m.color);
                }
            });

            // Castillo de meta (1-1, 1-2, 1-3)
            if (game.castleX > 0 && game.currentLevel !== '1-4') {
                const cx = game.castleX;
                const cy = GROUND_Y - TILE * 5;
                ctx.fillStyle = theme.brick;
                ctx.fillRect(cx, cy + TILE * 2, TILE * 5, TILE * 3);
                ctx.fillRect(cx + TILE, cy, TILE * 3, TILE * 2);
                ctx.fillRect(cx, cy + TILE * 1.5, TILE, TILE * 0.5);
                ctx.fillRect(cx + TILE * 4, cy + TILE * 1.5, TILE, TILE * 0.5);
                ctx.fillRect(cx + TILE, cy - TILE * 0.5, TILE * 0.7, TILE * 0.5);
                ctx.fillRect(cx + TILE * 2.1, cy - TILE * 0.5, TILE * 0.8, TILE * 0.5);
                ctx.fillRect(cx + TILE * 3.3, cy - TILE * 0.5, TILE * 0.7, TILE * 0.5);
                ctx.fillStyle = '#000000';
                ctx.fillRect(cx + TILE * 1.8, GROUND_Y - TILE * 2, TILE * 1.4, TILE * 2);
            }

            // Fosas de Lava (1-4)
            game.lavaPits.forEach(lp => {
                const lx = lp.startCol * TILE;
                const count = lp.endCol - lp.startCol + 1;
                drawLava(ctx, lx, GROUND_Y, count, game.frame);
            });

            // Banderín Final (1-1, 1-2, 1-3)
            if (game.flagpole.x > 0) {
                const fp = game.flagpole;
                ctx.fillStyle = '#80D010';
                ctx.fillRect(fp.x, fp.y, 6, fp.height);
                ctx.fillStyle = '#00A800';
                ctx.beginPath();
                ctx.moveTo(fp.x, fp.flagY);
                ctx.lineTo(fp.x - 36, fp.flagY + 16);
                ctx.lineTo(fp.x, fp.flagY + 32);
                ctx.closePath();
                ctx.fill();
            }

            // Suelo Sólido
            const startCol = Math.max(0, Math.floor(game.cameraX / TILE) - 1);
            const endCol = Math.min(game.levelWidthTiles, startCol + 27);
            for (let c = startCol; c <= endCol; c++) {
                if (!isPit(c)) {
                    drawGroundTile(ctx, c * TILE, GROUND_Y, theme);
                    drawGroundTile(ctx, c * TILE, GROUND_Y + TILE, theme);
                }
            }

            // Bloques Aéreos (Ladrillos, ?, Escalones)
            game.blocks.forEach(b => {
                if (b.x + TILE < game.cameraX || b.x > game.cameraX + VIRTUAL_W) return;
                if (b.type === 'question') {
                    drawQuestionTile(ctx, b.x, b.y, game.frame, b.used, theme);
                } else if (b.type === 'brick') {
                    drawBrickTile(ctx, b.x, b.y, theme);
                } else if (b.type === 'hard') {
                    drawHardBlockTile(ctx, b.x, b.y, theme);
                }
            });

            // Tuberías
            game.pipes.forEach(p => {
                if (p.x + p.w > game.cameraX && p.x < game.cameraX + VIRTUAL_W) {
                    drawPipe(ctx, p.x, p.y, 2, p.height, theme);
                }
            });

            // Barras de Fuego (Fire Bars en Castillo 1-4)
            game.fireBars.forEach(fb => {
                for (let i = 1; i <= fb.length; i++) {
                    const dist = i * 16;
                    const fx = fb.x + Math.cos(fb.angle) * dist;
                    const fy = fb.y + Math.sin(fb.angle) * dist;
                    ctx.fillStyle = '#FC9838';
                    ctx.beginPath();
                    ctx.arc(fx, fy, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FCF898';
                    ctx.beginPath();
                    ctx.arc(fx, fy, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Bowser (Castillo 1-4)
            if (game.bowser) {
                const b = game.bowser;
                drawPixelMatrix(ctx, SPRITES.bowser, PALETTES.bowser, Math.floor(b.x), Math.floor(b.y), 2, b.vx > 0);
            }

            // Hacha de la cadena (1-4)
            if (game.axe && !game.axe.triggered) {
                ctx.fillStyle = '#FC9838';
                ctx.fillRect(game.axe.x, game.axe.y, 16, 20);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(game.axe.x + 4, game.axe.y + 4, 8, 8);
            }

            // Toad (1-4)
            if (game.toad) {
                drawPixelMatrix(ctx, SPRITES.toad, PALETTES.toad, game.toad.x, game.toad.y, 2);
            }

            // Objetos (Monedas, Champiñones, Llamas)
            game.items.forEach(it => {
                if (it.type === 'mushroom') {
                    drawPixelMatrix(ctx, SPRITES.mushroom, PALETTES.mushroom, it.x, it.y, 2);
                } else if (it.type === 'bowserFlame') {
                    ctx.fillStyle = '#D82800';
                    ctx.fillRect(it.x, it.y, it.w, it.h);
                    ctx.fillStyle = '#FC9838';
                    ctx.fillRect(it.x + 4, it.y + 2, it.w - 8, it.h - 4);
                } else if (it.type === 'coinJump') {
                    ctx.fillStyle = '#FC9838';
                    ctx.fillRect(it.x + 4, it.y, 8, 20);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(it.x + 6, it.y + 2, 4, 16);
                }
            });

            // Enemigos detallados (Goombas con colmillos y Koopas de 16x24 con patrón de rombos)
            game.enemies.forEach(e => {
                if (e.x + e.w < game.cameraX || e.x > game.cameraX + VIRTUAL_W) return;
                if (e.type === 'goomba') {
                    let mat = SPRITES.goomba1;
                    if (e.state === 'squished') mat = SPRITES.goombaSquish;
                    else if (Math.floor(game.frame / 10) % 2 === 1) mat = SPRITES.goomba2;
                    drawPixelMatrix(ctx, mat, PALETTES.goomba, Math.floor(e.x), Math.floor(e.y), 2);
                } else if (e.type === 'koopa') {
                    if (e.state === 'shell') {
                        const flip = Math.abs(e.vx) > 0 && Math.floor(game.frame / 4) % 2 === 0;
                        drawPixelMatrix(ctx, SPRITES.koopaShell, PALETTES.koopa, Math.floor(e.x), Math.floor(e.y), 2, flip);
                    } else {
                        let mat = (Math.floor(game.frame / 10) % 2 === 1) ? SPRITES.koopaWalk2 : SPRITES.koopaWalk1;
                        drawPixelMatrix(ctx, mat, PALETTES.koopa, Math.floor(e.x), Math.floor(e.y), 2, e.vx > 0);
                    }
                }
            });

            // Mario
            if (!mario.hiddenInCastle && (mario.invulnerable % 4 < 2)) {
                let mMat = SPRITES.marioIdle;
                if (mario.animFrame === 1) mMat = SPRITES.marioRun1;
                else if (mario.animFrame === 2) mMat = SPRITES.marioRun2;
                else if (mario.animFrame === 3) mMat = SPRITES.marioJump;
                else if (mario.animFrame === 4) mMat = SPRITES.marioDuck;

                ctx.save();
                if (mario.isSuper && !mario.isDucking) {
                    ctx.translate(Math.floor(mario.x) - 3, Math.floor(mario.y) - 2);
                    ctx.scale(1, 1.9);
                    drawPixelMatrix(ctx, mMat, PALETTES.mario, 0, 0, 2, mario.facing === -1);
                } else {
                    drawPixelMatrix(ctx, mMat, PALETTES.mario, Math.floor(mario.x) - 3, Math.floor(mario.y) - 2, 2, mario.facing === -1);
                }
                ctx.restore();
            }

            // Partículas de Ladrillos
            game.particles.forEach(p => {
                ctx.fillStyle = p.color || '#C84C0C';
                ctx.fillRect(p.x, p.y, 10, 10);
            });

            // Textos flotantes
            ctx.font = '10px "Press Start 2P", monospace';
            game.floatingTexts.forEach(ft => {
                ctx.fillStyle = '#000000';
                ctx.fillText(ft.text, ft.x + 2, ft.y + 2);
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
            });

            ctx.restore();
        }

        /* ============================================================================
         * 8. INTERFAZ, HUD Y CONTROLADORES DE EVENTOS
         * ============================================================================ */
        function updateHUD() {
            document.getElementById('hudScore').textContent = String(game.score).padStart(6, '0');
            document.getElementById('hudCoins').textContent = '×' + String(game.coins).padStart(2, '0');
            document.getElementById('hudWorld').textContent = game.currentLevel;
            document.getElementById('hudTime').textContent = String(Math.max(0, game.time)).padStart(3, '0');
            document.getElementById('hudLives').textContent = '♥×' + game.lives;
        }

        function selectLevel(world, level) {
            const levelId = `${world}-${level}`;
            sfx.init();
            sfx.coin();
            hideModal();
            document.getElementById('titleOverlay').classList.add('hidden');
            showTransitionScreen(levelId);
        }

        function showModal(title, message, canResume = true) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('statScore').textContent = game.score;
            document.getElementById('statCoins').textContent = game.coins;
            document.getElementById('statTime').textContent = game.time;
            document.getElementById('btnModalResume').style.display = canResume ? 'inline-block' : 'none';
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function hideModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
        }

        function togglePause() {
            if (game.state === 'PLAYING') {
                game.state = 'PAUSED';
                sfx.bump();
                showModal('JUEGO EN PAUSA', 'Usa las Flechas / WASD para moverte y agacharte.\nEspacio para saltar y Shift para correr.', true);
            } else if (game.state === 'PAUSED') {
                hideModal();
                game.state = 'PLAYING';
            }
        }

        // Botones de Cabecera
        document.getElementById('btnStartGame').addEventListener('click', () => {
            selectLevel(1, 1);
        });

        document.getElementById('btnPause').addEventListener('click', () => {
            if (game.state === 'PLAYING' || game.state === 'PAUSED') togglePause();
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            selectLevel(1, 1);
        });

        document.getElementById('btnAudio').addEventListener('click', () => {
            const muted = sfx.toggleMute();
            document.getElementById('audioIcon').textContent = muted ? '🔇' : '🔊';
        });

        document.getElementById('btnModalResume').addEventListener('click', () => {
            if (game.state === 'PAUSED') togglePause();
        });

        document.getElementById('btnModalRestart').addEventListener('click', () => {
            selectLevel(1, 1);
        });

        // Controles de Teclado
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }

            if (game.state === 'TITLE' && (e.code === 'Space' || e.code === 'Enter')) {
                selectLevel(1, 1);
                return;
            }

            if (e.code === 'KeyP' || e.code === 'Escape') {
                if (game.state === 'PLAYING' || game.state === 'PAUSED') togglePause();
                return;
            }

            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyX') keys.run = true;

            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'KeyZ') {
                if (!keys.jump) keys.jumpPressed = true;
                keys.jump = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyX') keys.run = false;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'KeyZ') {
                keys.jump = false;
                keys.jumpPressed = false;
            }
        });

        // Controles Táctiles Adaptativos
        function bindTouch(id, onDown, onUp) {
            const btn = document.getElementById(id);
            const start = (e) => {
                e.preventDefault();
                sfx.init();
                btn.classList.add('active');
                onDown();
            };
            const end = (e) => {
                e.preventDefault();
                btn.classList.remove('active');
                onUp();
            };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('touchcancel', end, { passive: false });
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        }

        bindTouch('touchLeft', () => { keys.left = true; }, () => { keys.left = false; });
        bindTouch('touchRight', () => { keys.right = true; }, () => { keys.right = false; });
        bindTouch('touchDown', () => { keys.down = true; }, () => { keys.down = false; });
        bindTouch('touchRun', () => { keys.run = true; }, () => { keys.run = false; });
        bindTouch(
            'touchJump',
            () => {
                if (game.state === 'TITLE') { selectLevel(1, 1); return; }
                if (!keys.jump) keys.jumpPressed = true;
                keys.jump = true;
            },
            () => { keys.jump = false; keys.jumpPressed = false; }
        );

        /* ============================================================================
         * 9. BUCLE PRINCIPAL DE JUEGO (60 FPS)
         * ============================================================================ */
        function gameLoop() {
            game.frame++;

            if (game.state === 'PLAYING' || game.state === 'FLAGPOLE' || game.state === 'DYING') {
                updateMario();
                updateEntities();

                if (game.state === 'PLAYING') {
                    game.timeTick++;
                    if (game.timeTick >= 26) {
                        game.timeTick = 0;
                        game.time--;
                        updateHUD();
                        if (game.time <= 0) killMario();
                    }
                }
            }

            if (game.state !== 'TRANSITION') {
                renderGame();
            }

            requestAnimationFrame(gameLoop);
        }

        window.onload = function () {
            loadLevel('1-1');
            updateHUD();
            gameLoop();
        };
    </script>
